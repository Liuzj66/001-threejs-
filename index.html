<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宅匠 · 家居装修 3D 交互设计室</title>
<meta name="description" content="基于 three.js 的家居装修 3D 交互网站：即点即放布置家具、换色旋转、昼夜光照、漫游体验与方案存取。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="errbox" role="alert"></div>

<div id="loader">
  <div class="ld-mark">
    <div class="ld-logo">宅匠</div>
    <div class="ld-sub">正在搭建您的家…</div>
    <div class="ld-bar"><i></i></div>
    <div class="ld-tip">建议使用桌面端浏览器获得完整体验</div>
  </div>
</div>

<header id="topbar">
  <div class="brand">
    <span class="brand-cn">宅匠</span>
    <span class="brand-en">3D 家装工作台</span>
  </div>
  <nav class="grp" aria-label="视角">
    <button class="btn viewbtn active" data-view="persp" type="button">透视</button>
    <button class="btn viewbtn" data-view="top" type="button">俯视</button>
    <button class="btn viewbtn" data-view="walk" type="button">漫游</button>
  </nav>
  <nav class="grp" aria-label="环境">
    <button class="btn" id="btnNight" type="button">☀ 白天</button>
    <button class="btn active" id="btnSnap" type="button">吸附 开</button>
  </nav>
  <nav class="grp" aria-label="方案">
    <button class="btn" id="btnSave" type="button">保存方案</button>
    <button class="btn" id="btnLoad" type="button">读取方案</button>
    <button class="btn" id="btnExport" type="button">导出</button>
    <button class="btn" id="btnImport" type="button">导入</button>
    <button class="btn" id="btnShot" type="button">效果图</button>
    <button class="btn danger" id="btnClear" type="button">清空</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </nav>
</header>

<aside id="catalog" aria-label="家具目录">
  <div class="panel-head">
    <h2>家具目录</h2>
    <span class="sub">点击模型，再到地面放置</span>
  </div>
  <div id="catTabs" role="tablist"></div>
  <div id="catGrid"></div>
</aside>

<main id="viewport" aria-label="3D 视口"></main>

<aside id="side" aria-label="设置面板">
  <section id="propSec" hidden>
    <div class="panel-head"><h2>已选中家具</h2></div>
    <div class="prop-title">
      <span id="propName">—</span>
      <span id="propPrice">—</span>
    </div>
    <label class="lbl">主题颜色</label>
    <div id="propSwatches" class="swrow"></div>
    <label class="lbl" for="propColor">自定义颜色</label>
    <input type="color" id="propColor" value="#b98d6f">
    <label class="lbl">旋转</label>
    <div class="btnrow">
      <button class="btn" id="rotL" type="button">↺ 45°</button>
      <button class="btn" id="rotR" type="button">↻ 45°</button>
    </div>
    <label class="lbl">缩放</label>
    <div class="btnrow" id="scaleRow">
      <button class="btn" data-s="0.8" type="button">0.8×</button>
      <button class="btn active" data-s="1" type="button">1×</button>
      <button class="btn" data-s="1.25" type="button">1.25×</button>
    </div>
    <div class="btnrow gap-top">
      <button class="btn primary" id="btnDup" type="button">复制一份</button>
      <button class="btn danger" id="btnDel" type="button">删除</button>
    </div>
    <p class="tip">直接拖动家具可移动；方向键微调位置；R 旋转；Ctrl+D 复制；Del 删除。</p>
  </section>

  <section id="sceneSec">
    <div class="panel-head"><h2>场景设置</h2></div>
    <label class="lbl" for="roomW">开间（宽）<b id="roomWv">6 m</b></label>
    <input type="range" id="roomW" min="4" max="10" step="0.5" value="6">
    <label class="lbl" for="roomD">进深（深）<b id="roomDv">5 m</b></label>
    <input type="range" id="roomD" min="4" max="10" step="0.5" value="5">
    <label class="lbl">墙面颜色</label>
    <div id="wallRow" class="swrow"></div>
    <label class="lbl">地板</label>
    <div id="floorRow" class="swrow"></div>
    <button class="btn wide" id="btnDemo" type="button">✦ 一键示范客厅</button>
    <p class="tip">布置会自动保存在本浏览器；「保存方案」可存一份命名档，用「导出 / 导入」把方案变成文件分享。</p>
  </section>
</aside>

<footer id="statusbar">
  <span id="hint"></span>
  <span class="stats">家具 <b id="statCount">0</b> 件 · 预算合计 <b id="statTotal">¥0</b></span>
</footer>

<button class="panebtn" id="catToggle" type="button">目录</button>
<button class="panebtn right" id="sideToggle" type="button">设置</button>

<div id="toast" role="status"></div>

<script src="js/lib/three.min.js"></script>
<script src="js/lib/OrbitControls.js"></script>
<script src="js/furniture.js"></script>
<script src="js/app.js"></script>
</body>
</html>
